[project]
name = "Zap"
version = "0.1.1"
description = "Lightning Address / LNURL to BOLT11 invoice generator on CLI and PySide6 GUI."
authors = [
    { name = "Wolf" }, #, url="https://github.com/vv01f/lightning-address-invoice-generator"
    { name = "Velas Commerce" }, #, url="https://github.com/Velas-Commerce/lightning-address-invoice-generator"
]
requires-python = ">=3.13"

dependencies = [
    "requests",
    "bech32",
    "pyside6",
    "qrcode",
    "pillow",
    "websocket-client",
]

[tool.setuptools]
py-modules = ["lnaddress2invoice", "zap"]

[project.scripts]
zap = "zap:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W"]
